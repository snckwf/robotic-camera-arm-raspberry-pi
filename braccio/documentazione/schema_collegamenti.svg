<text x="50" y="920" font-size="12.5" font-weight="bold">Note:</text>
<text x="50" y="940" font-size="12.5" font-weight="normal">• PCA9685: VCC (logica) a 3,3 V dalla breakout; V+ (morsetto a vite) a +5V dei morsetti: lì passa la corrente dei servi.</text>
<text x="50" y="960" font-size="12.5" font-weight="normal">• I2C: PCA9685 (indirizzo 0x40) su GPIO2/3. Display LCD e controller sono opzionali: hanno i loro schemi.</text>
<text x="50" y="980" font-size="12.5" font-weight="normal">• KY-024 SOLO a 3,3 V: l'uscita DO va diretta sul GPIO24. Magnete al neodimio 6×3 mm incollato sotto il piatto rotante, sopra il sensore.</text>
<text x="50" y="1000" font-size="12.5" font-weight="normal">• Resistenza 330 Ω in linea solo su DIN dell'anello LED.</text>
<text x="50" y="1020" font-size="12.5" font-weight="normal">• Raspberry Pi: alimentato dal SUO alimentatore USB-C (5,1 V 3 A), non dai morsetti. La massa comune passa dal GND della breakout.</text>
<text x="50" y="1040" font-size="12.5" font-weight="normal">• Software: braccio_web.py pilota i servi tramite la PCA9685 (CH0 spalla, CH1 gomito, CH2 tilt, CH3 rotazione).</text>
</svg>