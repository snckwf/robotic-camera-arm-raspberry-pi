<text x="30" y="40" font-size="22" font-weight="bold">Braccio telecamera — collegamenti</text>
<text x="30" y="64" font-size="13" fill="#444">Schema a blocchi. Morsetti con i nomi BCM serigrafati sulla breakout Freenove. Rosso = +5V, nero = GND, arancio = 3,3 V, colori = segnali.</text>
