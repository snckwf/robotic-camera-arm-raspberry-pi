# go2rtc - arm camera stream (source: CamUI, MJPEG 1640x1232)
# Page: http://IP:1984  -  RTSP: rtsp://IP:8554/braccio  -  WebRTC port 8555
# The video is converted to H.264 with the Pi 4 hardware encoder only when someone is watching.
streams:
  braccio:
    - "exec:ffmpeg -hide_banner -loglevel error -f mpjpeg -i http://127.0.0.1:8080/video_feed_0 -vf scale=1280:960,format=yuv420p -c:v h264_v4l2m2m -b:v 2500k -g 30 -f rtsp {output}"
api:
  listen: ":1984"
rtsp:
  listen: ":8554"
webrtc:
  listen: ":8555"
log:
  level: warn
