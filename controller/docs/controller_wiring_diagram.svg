<text x="30" y="40" font-size="22" font-weight="bold" fill="#111" text-anchor="start">Camera arm — remote controller option</text>
<text x="30" y="64" font-size="13" font-weight="normal" fill="#444" text-anchor="start">Arduino Nano with 2 KY-023 joysticks and 4 buttons, connected to the Raspberry Pi with the USB cable only. Red = 5 V, black = GND, colours = signals.</text>
