<text x="1000" y="122" font-size="11" font-weight="normal" fill="#444" text-anchor="start">12×12 buttons (pins on opposite sides)</text>
<rect x="560" y="408" width="240" height="44" rx="6" fill="#fff4e6" stroke="#c2410c" stroke-width="1.5"/>
<text x="680" y="435" font-size="12" font-weight="bold" fill="#c2410c" text-anchor="middle">USB cable → Raspberry Pi USB port</text>
<polyline points="680,388 680,408" fill="none" stroke="#c2410c" stroke-width="4" stroke-linejoin="round"/>
<text x="50" y="656" font-size="12.5" font-weight="bold" fill="#111" text-anchor="start">Notes:</text>
<text x="50" y="676" font-size="12.5" font-weight="normal" fill="#111" text-anchor="start">• No wires to the arm box: the USB cable carries the data and powers the Nano.</text>
<text x="50" y="696" font-size="12.5" font-weight="normal" fill="#111" text-anchor="start">• Inputs D2-D7 with INPUT_PULLUP: each button closes to GND, no resistors.</text>
<text x="50" y="716" font-size="12.5" font-weight="normal" fill="#111" text-anchor="start">• Sketch: arm_console.ino (115200 baud). Software on the Pi: controller_braccio.py (controller-braccio service).</text>
<text x="50" y="736" font-size="12.5" font-weight="normal" fill="#111" text-anchor="start">• If a joint moves the wrong way, change its sign in SEGNO at the top of controller_braccio.py.</text>
</svg>