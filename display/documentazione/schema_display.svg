<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1400" height="760" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="bold" fill="#111" text-anchor="start">Braccio telecamera — opzione display LCD 16x2</text>
<text x="30" y="64" font-size="13" font-weight="normal" fill="#444" text-anchor="start">Dalla breakout del braccio e dai morsetti Forbox al traslatore BSS138 e al display. Rosso = +5V, nero = GND, arancio = 3,3 V, colori = segnali.</text>
<rect x="50" y="120" width="210" height="198" rx="6" fill="#e7f0fa" stroke="#1f6fb2" stroke-width="1.6"/>
<text x="155.0" y="139" font-size="13" font-weight="bold" fill="#1f6fb2" text-anchor="middle">Breakout Freenove</text>
<circle cx="260" cy="156" r="4.5" fill="#1f6fb2"/>
<text x="250" y="160" font-size="12" font-weight="normal" fill="#111" text-anchor="end">3V3</text>
<circle cx="260" cy="196" r="4.5" fill="#1f6fb2"/>
<text x="250" y="200" font-size="12" font-weight="normal" fill="#111" text-anchor="end">GPIO2 (SDA)</text>
<circle cx="260" cy="236" r="4.5" fill="#1f6fb2"/>
<text x="250" y="240" font-size="12" font-weight="normal" fill="#111" text-anchor="end">GPIO3 (SCL)</text>
<circle cx="260" cy="276" r="4.5" fill="#1f6fb2"/>
<text x="250" y="280" font-size="12" font-weight="normal" fill="#111" text-anchor="end">GND</text>
<text x="155.0" y="308" font-size="10.5" font-weight="normal" fill="#666" text-anchor="middle">morsetti a vite (BCM)</text>
<text x="50" y="330" font-size="11" font-weight="normal" fill="#444" text-anchor="start">GPIO2/3 sono gli stessi della PCA9685:</text>
<text x="50" y="346" font-size="11" font-weight="normal" fill="#444" text-anchor="start">il bus I2C è condiviso, basta un secondo filo</text>
<text x="50" y="362" font-size="11" font-weight="normal" fill="#444" text-anchor="start">sullo stesso morsetto.</text>
<polyline points="470,110 470,470" fill="none" stroke="#d22" stroke-width="5" stroke-linejoin="round"/>
<polyline points="510,110 510,470" fill="none" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
<text x="460" y="100" font-size="12" font-weight="bold" fill="#d22" text-anchor="end">Morsetti +5V</text>
<text x="520" y="100" font-size="12" font-weight="bold" fill="#111" text-anchor="start">Morsetti GND</text>
<rect x="640" y="120" width="260" height="208" rx="6" fill="#eef3fb" stroke="#1f3a6e" stroke-width="1.6"/>
<text x="770.0" y="139" font-size="13" font-weight="bold" fill="#1f3a6e" text-anchor="middle">Traslatore BSS138</text>
<circle cx="640" cy="156" r="4.5" fill="#1f3a6e"/>
<text x="650" y="160" font-size="12" font-weight="normal" fill="#111" text-anchor="start">LV</text>
<circle cx="640" cy="190" r="4.5" fill="#1f3a6e"/>
<text x="650" y="194" font-size="12" font-weight="normal" fill="#111" text-anchor="start">LV1</text>
<circle cx="640" cy="224" r="4.5" fill="#1f3a6e"/>
<text x="650" y="228" font-size="12" font-weight="normal" fill="#111" text-anchor="start">LV2</text>
<circle cx="640" cy="258" r="4.5" fill="#1f3a6e"/>
<text x="650" y="262" font-size="12" font-weight="normal" fill="#111" text-anchor="start">GND</text>
<circle cx="640" cy="292" r="4.5" fill="#1f3a6e"/>
<text x="650" y="296" font-size="12" font-weight="normal" fill="#111" text-anchor="start">HV</text>
<circle cx="900" cy="190" r="4.5" fill="#1f3a6e"/>
<text x="890" y="194" font-size="12" font-weight="normal" fill="#111" text-anchor="end">HV1</text>
<circle cx="900" cy="224" r="4.5" fill="#1f3a6e"/>
<text x="890" y="228" font-size="12" font-weight="normal" fill="#111" text-anchor="end">HV2</text>
<text x="770.0" y="318" font-size="10.5" font-weight="normal" fill="#666" text-anchor="middle">lato LV = 3,3 V (Pi)   lato HV = 5 V (LCD)</text>
<rect x="1080" y="120" width="260" height="174" rx="6" fill="#eef3fb" stroke="#1f3a6e" stroke-width="1.6"/>
<text x="1210.0" y="139" font-size="13" font-weight="bold" fill="#1f3a6e" text-anchor="middle">LCD 16x2 + modulo I2C</text>
<circle cx="1080" cy="156" r="4.5" fill="#1f3a6e"/>
<text x="1090" y="160" font-size="12" font-weight="normal" fill="#111" text-anchor="start">SDA</text>
<circle cx="1080" cy="190" r="4.5" fill="#1f3a6e"/>
<text x="1090" y="194" font-size="12" font-weight="normal" fill="#111" text-anchor="start">SCL</text>
<circle cx="1080" cy="224" r="4.5" fill="#1f3a6e"/>
<text x="1090" y="228" font-size="12" font-weight="normal" fill="#111" text-anchor="start">VCC</text>
<circle cx="1080" cy="258" r="4.5" fill="#1f3a6e"/>
<text x="1090" y="262" font-size="12" font-weight="normal" fill="#111" text-anchor="start">GND</text>
<text x="1210.0" y="284" font-size="10.5" font-weight="normal" fill="#666" text-anchor="middle">PCF8574 - indirizzo 0x27 o 0x3F</text>
<polyline points="260,156 560,156 560,156 640,156" fill="none" stroke="#ff9900" stroke-width="2.6" stroke-linejoin="round"/>
<circle cx="260" cy="156" r="5" fill="#ff9900"/>
<circle cx="640" cy="156" r="5" fill="#ff9900"/>
<text x="570" y="150" font-size="10" font-weight="normal" fill="#c25e00" text-anchor="start">vedi nota</text>
<polyline points="260,196 590,196 590,190 640,190" fill="none" stroke="#2a9d8f" stroke-width="2.6" stroke-linejoin="round"/>
<circle cx="260" cy="196" r="5" fill="#2a9d8f"/>
<circle cx="640" cy="190" r="5" fill="#2a9d8f"/>
<polyline points="260,236 610,236 610,224 640,224" fill="none" stroke="#8d6e63" stroke-width="2.6" stroke-linejoin="round"/>
<circle cx="260" cy="236" r="5" fill="#8d6e63"/>
<circle cx="640" cy="224" r="5" fill="#8d6e63"/>
<polyline points="260,276 510,276" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
<circle cx="510" cy="276" r="5" fill="#111"/>
<polyline points="510,258 640,258" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round"/>
<circle cx="510" cy="258" r="5" fill="#111"/>
<polyline points="470,292 640,292" fill="none" stroke="#d22" stroke-width="2.6" stroke-linejoin="round"/>
<circle cx="470" cy="292" r="5" fill="#d22"/>
<polyline points="470,400 1040,400 1040,224 1080,224" fill="none" stroke="#d22" stroke-width="2.6" stroke-linejoin="round"/>
<circle cx="470" cy="400" r="5" fill="#d22"/>
<polyline points="510,430 1060,430 1060,258 1080,258" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round"/>
<circle cx="510" cy="430" r="5" fill="#111"/>
<polyline points="900,190 990,190 990,156 1080,156" fill="none" stroke="#2a9d8f" stroke-width="2.6" stroke-linejoin="round"/>
<circle cx="900" cy="190" r="5" fill="#2a9d8f"/>
<circle cx="1080" cy="156" r="5" fill="#2a9d8f"/>
<polyline points="900,224 1010,224 1010,190 1080,190" fill="none" stroke="#8d6e63" stroke-width="2.6" stroke-linejoin="round"/>
<circle cx="900" cy="224" r="5" fill="#8d6e63"/>
<circle cx="1080" cy="190" r="5" fill="#8d6e63"/>
<text x="50" y="520" font-size="12.5" font-weight="bold" fill="#111" text-anchor="start">Note:</text>
<text x="50" y="540" font-size="12.5" font-weight="normal" fill="#111" text-anchor="start">• Il traslatore serve perché l'LCD lavora a 5 V e i GPIO del Pi a 3,3 V. Nella scatola del braccio c'è già la sede per il modulo.</text>
<text x="50" y="560" font-size="12.5" font-weight="normal" fill="#111" text-anchor="start">• Prova del traslatore: alimentalo solo dal lato 5 V e misura il pin 3V3 (LV). Se trovi già ~3,3 V ha un regolatore a bordo e il filo 3V3 dal Pi NON va collegato.</text>
<text x="50" y="580" font-size="12.5" font-weight="normal" fill="#111" text-anchor="start">• Display remoto: 4 fili (5V, GND, SDA, SCL dal lato HV). Tienili corti, al massimo circa 1 m, meglio se intrecciati.</text>
<text x="50" y="600" font-size="12.5" font-weight="normal" fill="#111" text-anchor="start">• Il contrasto si regola con il trimmer blu sul retro del modulo I2C. Software: display_lcd.py (servizio display-lcd, porta 8092).</text>
</svg>